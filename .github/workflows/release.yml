name: Release

# Push a version tag (e.g. `git tag v2.0.1 && git push origin v2.0.1`) and this handles the rest:
# publish the WinUI 3 app (Procure.App), pack with Velopack, and upload to GitHub Releases with notes
# generated from the commits since the last tag.
#
# Every release is uploaded as a PRE-RELEASE. Installed apps only look at full releases
# (GithubSource prerelease: false in UpdateService), so nobody receives it until it has been tested
# and promoted by hand:
#   gh release edit vX.Y.Z --prerelease=false --latest
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0 # full history - needed to diff commits since the previous tag

      # No Windows App SDK auto-bump any more: the WinUI app is pinned to the 1.8 line in
      # Procure.App.csproj (the 2.x package's WinUI part does not restore here). Move it by hand, and
      # test, when upgrading.

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          # --self-contained bundles the .NET runtime into the app folder; WindowsAppSDKSelfContained
          # bundles the WinUI 3 native runtime. Both are required for an install that needs no
          # prerequisites and no admin rights. A runtime id alone does NOT imply self-contained
          # since .NET 6 - the flag has to be explicit - and RuntimeIdentifier is the supported
          # knob (RuntimeIdentifierOverride is internal).
          $version = "${{ github.ref_name }}" -replace '^v', ''
          dotnet publish Procure.App/Procure.App.csproj -f net10.0-windows10.0.19041.0 -c Release `
            -p:Version=$version `
            -p:RuntimeIdentifier=win-x64 `
            --self-contained `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true

      - name: Generate release notes from commits since the previous tag
        shell: pwsh
        run: |
          $currentTag = "${{ github.ref_name }}"
          $prevTag = git describe --tags --abbrev=0 "$currentTag~1" 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $prevTag) {
            git log --pretty=format:"- %s" | Out-File -FilePath notes.md -Encoding utf8
          } else {
            git log "$prevTag..$currentTag" --pretty=format:"- %s" | Out-File -FilePath notes.md -Encoding utf8
          }
          Get-Content notes.md

      # Pinned to match the Velopack library version in Procure.App.csproj - a floating vpk could
      # change delta / feed behaviour between releases with no corresponding code change. The
      # global tool persists across the steps below (same runner, same job).
      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk --version 1.2.0

      # Pulls the current latest (full) release's package + releases.win.json into .\Releases so the
      # pack step can diff against it and emit a delta. continue-on-error: the very first delta
      # release has no base, and a transient GitHub 5xx must not fail a release - pack then just
      # produces a full-only package, exactly the old behaviour.
      - name: Download latest release (delta base)
        id: vpk_download
        continue-on-error: true
        shell: pwsh
        run: |
          vpk download github `
            --repoUrl https://github.com/${{ github.repository }} `
            --token "${{ secrets.GITHUB_TOKEN }}"

      - name: Pack with Velopack
        shell: pwsh
        run: |
          if ("${{ steps.vpk_download.outcome }}" -ne "success") {
            Write-Host "::warning::No delta base downloaded - this release will be full-only."
          }
          $version = "${{ github.ref_name }}" -replace '^v', ''
          # Same package id (-u Procure) and exe name (-e Procure.exe) as every MAUI release: that is
          # what makes an installed copy update in place.
          vpk pack -u Procure -v $version -e Procure.exe `
            -p Procure.App\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish `
            --releaseNotes notes.md

      # Surfaces the delta / full ratio in the run log so each release can be eyeballed. A ratio
      # near 100% just means a broad change (a runtime bump) - informational, never a gate.
      - name: Report delta size
        shell: pwsh
        run: |
          $full = Get-ChildItem Releases -Filter "*-full.nupkg" | Select-Object -First 1
          $delta = Get-ChildItem Releases -Filter "*-delta.nupkg" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($delta -and $full) {
            $ratio = [math]::Round($delta.Length / $full.Length * 100)
            Write-Host "Delta $([math]::Round($delta.Length/1MB,2)) MB / Full $([math]::Round($full.Length/1MB,1)) MB ($ratio% of full)"
          } elseif ($full) {
            Write-Host "::warning::Full-only release ($([math]::Round($full.Length/1MB,1)) MB) - no delta generated."
          }

      - name: Upload to GitHub Releases (as a pre-release)
        shell: pwsh
        run: |
          vpk upload github --repoUrl https://github.com/${{ github.repository }} `
            --publish --pre --tag "${{ github.ref_name }}" --token "${{ secrets.GITHUB_TOKEN }}"

          # vpk always uploads a legacy Squirrel-compat "RELEASES" file itself (not read from
          # disk, so deleting it beforehand does nothing) - no client here uses it, strip it
          # from the published release afterward instead.
          gh release delete-asset "${{ github.ref_name }}" RELEASES -y --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
